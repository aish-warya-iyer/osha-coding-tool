<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSHA Heat Rule — Segment Coding</title>
<style>
  :root{
    --paper:#F3F1EA;
    --paper-raised:#FBFAF6;
    --ink:#1E2A22;
    --ink-soft:#4A564C;
    --rule:#C9C3B4;
    --accent:#2F4D63;
    --accent-soft:#DCE6EA;
    --flag:#9A5B2E;
    --flag-soft:#F3E3D3;
    --good:#3C6E4E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    line-height:1.5;
  }
  .chrome{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  #app{
    max-width:680px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.topbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--rule);
    padding-bottom:14px;
    margin-bottom:24px;
  }
  header.topbar h1{
    font-size:1.15rem;
    margin:0;
    font-weight:normal;
    letter-spacing:0.2px;
  }
  header.topbar .meta{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:20px 22px;
    margin-bottom:18px;
  }
  .segment-text{
    font-size:1.18rem;
    line-height:1.6;
    padding:4px 2px;
  }
  .segment-label{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .section-tag{
    display:inline-block;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.74rem;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:2px;
    padding:1px 7px;
    margin-bottom:10px;
  }
  .gate-question, .item-q{
    font-size:1.02rem;
  }
  .btnrow{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  button{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.92rem;
    border-radius:3px;
    border:1px solid var(--accent);
    background:var(--paper-raised);
    color:var(--accent);
    padding:9px 18px;
    cursor:pointer;
  }
  button.primary{
    background:var(--accent);
    color:#fff;
  }
  button.ghost{
    border-color:var(--rule);
    color:var(--ink-soft);
  }
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button:hover{filter:brightness(0.97);}
  button:disabled{opacity:0.4; cursor:not-allowed; filter:none;}
  .items-list{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.92rem;
    padding-left:0;
  }
  .item-row.branch{
    margin-left:26px;
    color:var(--ink-soft);
  }
  .item-row input[type=checkbox], .item-row input[type=radio]{
    margin-top:3px;
  }
  .item-row .label{font-weight:600;}
  .item-row .q{color:var(--ink-soft); font-weight:normal;}
  textarea, input[type=text], select{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.9rem;
    width:100%;
    border:1px solid var(--rule);
    border-radius:3px;
    padding:8px 10px;
    background:#fff;
    color:var(--ink);
  }
  textarea{min-height:60px; resize:vertical;}
  .progress{
    display:flex;
    gap:4px;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.68rem;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .progress span{
    border:1px solid var(--rule);
    border-radius:2px;
    padding:2px 6px;
    color:var(--ink-soft);
  }
  .progress span.done{ background:var(--good); border-color:var(--good); color:#fff; }
  .progress span.current{ border-color:var(--accent); color:var(--accent); font-weight:bold; }
  .progress span.skipped{ color:#B8B2A2; text-decoration:line-through; }
  .flagbar{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.85rem;
    color:var(--flag);
    background:var(--flag-soft);
    border:1px solid var(--flag);
    border-radius:3px;
    padding:8px 12px;
    margin-top:12px;
  }
  .warn{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.82rem;
    color:var(--flag);
    margin-top:8px;
  }
  .small{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  footer.foot{
    margin-top:36px;
    text-align:center;
  }
  footer.foot a{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.76rem;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .divider{border:none; border-top:1px solid var(--rule); margin:20px 0;}
  table.admin-table{
    width:100%;
    border-collapse:collapse;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.82rem;
  }
  table.admin-table td, table.admin-table th{
    border-bottom:1px solid var(--rule);
    padding:6px 4px;
    text-align:left;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  /* ---- Consensus review ---- */
  :root{ --agree-bg:#DCEBDF; --disagree-bg:#F5D8D3; --none-bg:#ECEAE4; }
  table.cons-table{ width:100%; border-collapse:collapse; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:0.84rem; margin:6px 0 14px; }
  table.cons-table th, table.cons-table td{ border:1px solid var(--rule); padding:5px 8px; text-align:left; vertical-align:top; }
  table.cons-table thead th{ background:var(--paper); font-weight:600; }
  table.cons-table tr.c-agree td, table.cons-table tr.c-agree th{ background:var(--agree-bg); }
  table.cons-table tr.c-disagree td, table.cons-table tr.c-disagree th{ background:var(--disagree-bg); }
  table.cons-table tr.c-none td, table.cons-table tr.c-none th{ background:var(--none-bg); color:var(--ink-soft); }
  table.cons-table tr.gate-row th{ font-weight:600; }
  table.cons-table{ table-layout:fixed; }
  table.cons-table th:first-child{ width:40%; }
  table.cons-table th:last-child, table.cons-table td.final{ width:130px; }
  table.cons-table td.final{ background:var(--paper-raised) !important; }
  .cons-hide-gray tr.c-none:not(.gate-row){ display:none; }
  .cons-tag{ display:inline-block; font-size:0.72rem; padding:1px 7px; border-radius:10px; border:1px solid var(--rule); margin-left:6px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .cons-tag.flag{ background:var(--flag-soft); border-color:var(--flag); color:var(--flag); }
  .cons-tag.dis{ background:var(--disagree-bg); }
  .cons-tag.ok{ background:var(--agree-bg); }

  .cons-note{ border-left:3px solid var(--rule); padding:2px 10px; margin:4px 0 8px; font-size:0.86rem; }
</style>
</head>

/* =========================================================
   BACKEND — Google Sheets via Apps Script Web App
   Paste your deployed web app URL (ends in /exec) below.

   ========================================================= */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3kTDVgVT4vdffJFdd-iC41cMZDCp-br_E53NzF4TOgiLSvsry4pD2fBsSW68xzUja/exec';

function backendConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === -1;
}

// Counts reads that FAILED (network error, blocked request, old backend). Without this, a failed
// read looks identical to "no data yet", and an export/review screen would quietly come up empty.
let BACKEND_READ_ERRORS = 0;

async function safeGet(key){
  if(!backendConfigured()) return null;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(key));
    const data = await res.json();
    if(data && data.error){ BACKEND_READ_ERRORS++; return null; }
    return (data && data.value != null) ? data.value : null;
  }catch(e){ BACKEND_READ_ERRORS++; console.error('safeGet failed', e); return null; }
}
async function safeSet(key, value){
  if(!backendConfigured()) return false;
  try{
    // NOTE: body is sent as a plain string (no custom headers) on purpose —
    // this keeps it a CORS "simple request" so the browser doesn't send a
    // preflight OPTIONS call, which Apps Script web apps don't handle.
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'set', key, value })
    });
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){ console.error('safeSet failed', e); return false; }
}
async function safeList(prefix){
  if(!backendConfigured()) return [];
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=list&prefix=' + encodeURIComponent(prefix||''));
    const data = await res.json();
    return (data && data.keys) ? data.keys : [];
  }catch(e){ console.error('safeList failed', e); return []; }
}
// Returns { fullKey: value } for every row whose key starts with `prefix`, in one round trip.
// Requires the updated Apps Script backend (action=getPrefix) — falls back to {} on an old
// deployment that doesn't recognize the action yet, which callers handle gracefully.
async function safeGetPrefix(prefix){
  if(!backendConfigured()) return {};
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=getPrefix&prefix=' + encodeURIComponent(prefix||''));
    const data = await res.json();
    // An old backend (without the getPrefix action) answers {error:'unknown action'}.
    if(!data || data.error || !data.entries){ BACKEND_READ_ERRORS++; return {}; }
    return data.entries;
  }catch(e){ BACKEND_READ_ERRORS++; console.error('safeGetPrefix failed', e); return {}; }
}

function backendReadWarning(){
  return `<div class="warn chrome" style="margin-bottom:12px;color:var(--flag);"><strong>Could not read everything from the sheet (${BACKEND_READ_ERRORS} request(s) failed).</strong> What you see below may be incomplete or empty even though data exists. Check your internet connection, make sure the Apps Script backend has been redeployed with the latest version, hard refresh (Ctrl/Cmd + Shift + R) and try again.</div>`;
}
async function safeDelete(key){
  if(!backendConfigured()) return false;
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'delete', key })
    });
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){ console.error('safeDelete failed', e); return false; }
}
async function testBackend(){
  if(!backendConfigured()) return {ok:false, msg:'Apps Script URL not set yet — edit APPS_SCRIPT_URL near the top of the <script> block.'};
  const testKey = 'osha:_connection_test';
  const testVal = 'ping-'+Date.now();
  const setOk = await safeSet(testKey, testVal);
  if(!setOk) return {ok:false, msg:'Could not write to the sheet. Check the deployment is "Anyone" access and the URL ends in /exec.'};
  const got = await safeGet(testKey);
  if(got !== testVal) return {ok:false, msg:'Wrote OK but read back a mismatch — check the Apps Script code matches the provided version.'};
  return {ok:true, msg:'Connected. Read/write to the sheet is working.'};
}

/* =========================================================
   ASSIGNMENT GENERATION — balanced random, min 3 of 5 coders per segment
   ========================================================= */
function generateAssignment(){
  const counts = {}; CODERS.forEach(c => counts[c] = 0);
  const perSegment = {}; // segmentId -> [coders]
  STATE.segments.forEach(seg => {
    const ranked = CODERS.slice().sort((a,b)=>{
      const d = counts[a]-counts[b];
      return d !== 0 ? d : (Math.random()-0.5);
    });
    const chosen = ranked.slice(0, MIN_CODERS_PER_SEGMENT);
    chosen.forEach(c => counts[c]++);
    perSegment[seg.segmentId] = chosen;
  });
  const assignment = {};
  CODERS.forEach(c => {
    const mySegs = STATE.segments.filter(s => perSegment[s.segmentId].includes(c)).map(s=>s.segmentId);
    // shuffle order per coder
    for(let i = mySegs.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [mySegs[i],mySegs[j]] = [mySegs[j],mySegs[i]];
    }
    assignment[c] = { order: mySegs };
  });
  return assignment;
}

/* ---------- Coding screen ---------- */
function draftKey(){ return 'osha:draft:'+STATE.coder; }

async function saveDraft(){
  // While reviewing an already-completed segment, never touch the shared draft slot —
  // it may belong to a different, still-in-progress segment and must not be clobbered.
  if(STATE.reviewMode) return true;
  const draft = { segmentId: STATE.currentSegmentId, sectionIndex: STATE.sectionIndex, sectionState: STATE.sectionState };
  return await safeSet(draftKey(), JSON.stringify(draft));
}
async function clearDraft(){
  await safeDelete(draftKey());
}

function responseKeyPrefix(coder){ return 'osha:responses:'+coder+'::'; }

/* Loads a coder's completed-segment records.
   Each segment is stored under its OWN key (osha:responses:<coder>::<segmentId>)
   instead of one giant JSON blob per coder — a single Google Sheets cell is capped
   at 50,000 characters, and a coder with ~50-70 completed segments in one blob can
   silently sail past that limit, so every save after that point fails quietly while
   the UI still says "saved." Splitting into one small row per segment removes that
   ceiling entirely.
   For anyone who already has data under the old single-blob key (osha:responses:<coder>),
   this transparently migrates it the first time it's loaded: copies any segment not
   already present under the new per-segment keys, without deleting the old blob. */
async function loadCoderResponses(coder){
  const prefix = responseKeyPrefix(coder);
  const entries = await safeGetPrefix(prefix);
  const responses = {};
  Object.keys(entries).forEach(fullKey=>{
    const segId = fullKey.slice(prefix.length);
    try{ responses[segId] = JSON.parse(entries[fullKey]); }catch(e){ /* skip a corrupt row */ }
  });

  const legacyRaw = await safeGet('osha:responses:'+coder);
  if(legacyRaw){
    let legacy = {};
    try{ legacy = JSON.parse(legacyRaw); }catch(e){ legacy = {}; }
    const missing = Object.keys(legacy).filter(segId => !(segId in responses));
    for(const segId of missing){
      responses[segId] = legacy[segId];
      await safeSet(prefix+segId, JSON.stringify(legacy[segId]));
    }
  }
  return responses;
}

async function beginSegment(segmentId){
  STATE.reviewMode = false;
  STATE.currentSegmentId = segmentId;
  STATE.sectionIndex = 0;
  STATE.sectionState = { answers:{}, texts:{}, sectionsDone:{}, sectionAnyYes:false, anyYesOverall:false, flagged:false, memo:'', rationale:'', confidence:null, confidenceExplain:'' };

  const draftRaw = await safeGet(draftKey());
  if(draftRaw){
    try{
      const draft = JSON.parse(draftRaw);
      if(draft.segmentId === segmentId){
        STATE.sectionIndex = draft.sectionIndex;
        STATE.sectionState = draft.sectionState;
        STATE.justResumed = true;
      }
    }catch(e){ /* ignore a corrupt draft, start fresh */ }
  }
  STATE.view = 'code';
  render();
}

/* Re-open a segment that's already been fully coded, so a coder can double-check
   or correct an earlier answer. This reconstructs the working state from the saved
   record rather than from the (unrelated) in-progress draft. */
async function reviewCompletedSegment(segmentId){
  STATE.reviewMode = true;
  STATE.currentSegmentId = segmentId;
  STATE.sectionIndex = 0;
  const rec = STATE.responses[segmentId] || {};
  const answers = Object.assign({}, rec.answers || {});
  const sectionsDone = {};
  CODEBOOK.forEach(s=>{
    if(answers[s.id] === true) sectionsDone[s.id] = 'yes';
    else if(answers[s.id] === false) sectionsDone[s.id] = 'no';
  });
  STATE.sectionState = {
    answers: answers,
    texts: Object.assign({}, rec.texts || {}),
    sectionsDone: sectionsDone,
    sectionAnyYes: false,
    anyYesOverall: CODEBOOK.some(s=>answers[s.id]===true),
    flagged: !!rec.flagged,
    memo: rec.memo || '',
    rationale: rec.rationale || '',
    confidence: rec.confidence || null,
    confidenceExplain: rec.confidenceExplain || '',
    nonSubstantive: rec.nonSubstantive || null
  };
  STATE.justResumed = false;
  STATE.view = 'code';
  render();
}

function currentSegmentObj(){
  return STATE.segments.find(s=>s.segmentId===STATE.currentSegmentId);
}

function assignedList(){
  return (STATE.assignment[STATE.coder] && STATE.assignment[STATE.coder].order) || [];
}

function renderCode(){
  const seg = currentSegmentObj();
  const list = assignedList();
  const doneCount = list.filter(id => STATE.responses[id] && STATE.responses[id].complete).length;

  if(STATE.sectionIndex >= CODEBOOK.length){
    return renderSectionL();
  }

  const section = CODEBOOK[STATE.sectionIndex];
  const gateAnswered = section.id in STATE.sectionState.answers ? STATE.sectionState.answers[section.id] : null;

  const progressHtml = CODEBOOK.map((s,i)=>{
    let cls = '';
    if(i < STATE.sectionIndex) cls = STATE.sectionState.sectionsDone[s.id]==='yes' ? 'done' : 'skipped';
    if(i === STATE.sectionIndex) cls = 'current';
    return `<span class="${cls}">${s.id}</span>`;
  }).join('');

  function visibleItems(){
    return section.items.filter(item => !item.branchFrom || STATE.sectionState.answers[item.branchFrom] === true);
  }
  function sectionComplete(){
    const vis = visibleItems();
    if(section.single || section.singleWithinGroup) return vis.some(it => STATE.sectionState.answers[it.code] === true);
    return vis.every(it => STATE.sectionState.answers[it.code] === true || STATE.sectionState.answers[it.code] === false);
  }

  let itemsHtml = '';
  if(gateAnswered === true){
    const modeNote = section.single ? 'Select the one option that best fits — this section is single-select.'
      : section.singleWithinGroup ? 'For each group below, pick at most one option. A segment can have one from each group (e.g. one victim AND one antagonist) — just not two within the same group.'
      : 'Answer Yes or No for every item below — each is its own question, not a checklist.';

    const groupLabels = {victim:'Victim', protagonist:'Protagonist', antagonist:'Antagonist'};

    function renderItemRow(item){
      const current = STATE.sectionState.answers[item.code]; // true, false, or undefined
      const rowClass = item.branchFrom ? 'item-row branch' : 'item-row';
      let textField = '';
      if(item.hasText && current === true){
        textField = `<div style="margin-left:26px;margin-top:4px;">
          <input type="text" placeholder="${item.textLabel||'Specify'}" data-textfor="${item.code}" value="${(STATE.sectionState.texts[item.code]||'').replace(/"/g,'&quot;')}"/>
        </div>`;
      }
      let buttonsHtml;
      if(section.single || section.singleWithinGroup){
        const selCls = current === true ? 'primary' : '';
        const groupAttr = item.group ? ` data-group="${item.group}"` : '';
        buttonsHtml = `<button type="button" class="${selCls}" data-code="${item.code}" data-toggle="true"${groupAttr} style="padding:5px 12px;">${current===true ? 'Selected' : 'Select'}</button>`;
      } else {
        const yesCls = current === true ? 'primary' : '';
        const noCls = current === false ? 'primary' : '';
        buttonsHtml = `<button type="button" class="${yesCls}" data-code="${item.code}" data-value="true" style="padding:5px 12px;">Yes</button>
            <button type="button" class="${noCls}" data-code="${item.code}" data-value="false" style="padding:5px 12px;">No</button>`;
      }
      return `<div class="${rowClass}">
          <div style="flex:1;"><span class="label">${item.label}</span><br><span class="q">${item.q}</span></div>
          <div style="display:flex;gap:6px;flex-shrink:0;">${buttonsHtml}</div>
        </div>${textField}`;
    }

    let bodyHtml;
    if(section.singleWithinGroup){
      const groups = [];
      visibleItems().forEach(it=>{ if(!groups.includes(it.group)) groups.push(it.group); });
      bodyHtml = groups.map(g=>{
        const groupItems = visibleItems().filter(it=>it.group===g);
        return `<div class="small chrome" style="margin-top:12px;margin-bottom:2px;font-weight:600;">${groupLabels[g]||g}</div>` + groupItems.map(renderItemRow).join('');
      }).join('');
    } else {
      bodyHtml = visibleItems().map(renderItemRow).join('');
    }

    let sectionTextHtml = '';
    if(section.sectionText && section.items.some(it => STATE.sectionState.answers[it.code] === true)){
      const st = section.sectionText;
      sectionTextHtml = `<div class="field" style="margin-top:10px;">
        <label>${st.label}</label>
        <input type="text" data-sectiontextfor="${st.code}" value="${(STATE.sectionState.texts[st.code]||'').replace(/"/g,'&quot;')}"/>
      </div>`;
    }

    itemsHtml = `<p class="small chrome">${modeNote}</p>
    <div class="items-list">${bodyHtml}</div>
    ${sectionTextHtml}
    <div class="btnrow"><button class="primary" id="continueBtn" ${sectionComplete()?'':'disabled'}>Continue</button></div>
    ${sectionComplete() ? '' : '<p class="small chrome">Answer every item above to continue.</p>'}
    <div id="warnBox"></div>`;
  }

  const resumeBanner = STATE.justResumed ? `<div class="flagbar chrome" style="color:var(--good);background:#E5F0E9;border-color:var(--good);">Resumed where you left off on this segment.</div>` : '';
  STATE.justResumed = false;
  const reviewBanner = STATE.reviewMode ? `<div class="flagbar chrome" style="color:#8a6d00;background:#FFF6DD;border-color:#e0c060;">Reviewing a segment you already finished. Step through to "Save" at the end to update the saved answer — nothing changes until then.</div>` : '';

  app.innerHTML = `
    ${topbar(`${STATE.coder} · segment ${doneCount+1} of ${list.length}`)}
    ${resumeBanner}
    ${reviewBanner}
    <div class="progress chrome">${progressHtml}</div>
    <div class="card">
      <div class="segment-label chrome">Segment text (comment identity hidden)</div>
      <div class="segment-text">${escapeHtml(seg.text)}</div>
    </div>
    <div class="card chrome">
      <span class="section-tag">Section ${section.id} — ${section.title}</span>
      <div class="gate-question">${section.gate}</div>
      ${gateAnswered===true ? `<div class="small chrome" style="margin-bottom:4px;">Gate answer: <strong>Yes</strong> — <a id="revertGate" style="cursor:pointer;text-decoration:underline;">meant to click No? change it</a></div>${itemsHtml}` : `
      <div class="btnrow">
        <button id="gateYes">Yes</button>
        <button id="gateNo">No</button>
      </div>`}
    </div>
    <div class="btnrow">
      ${STATE.sectionIndex>0 ? '<button class="ghost" id="backBtn">Back a section</button>' : ''}
      ${STATE.reviewMode
        ? '<button class="ghost" id="exitReviewBtn">Back to my segments</button>'
        : '<button class="ghost" id="saveProgressBtn">Save progress</button><span id="saveProgressMsg" class="small chrome"></span>'}
    </div>
  `;

  if(gateAnswered !== true){
    document.getElementById('gateYes').onclick = ()=>{
      STATE.sectionState.answers[section.id] = true;
      render();
      saveDraft();
    };
    document.getElementById('gateNo').onclick = ()=>{
      STATE.sectionState.answers[section.id] = false;
      STATE.sectionState.sectionsDone[section.id] = 'no';
      STATE.sectionIndex++;
      render();
      saveDraft();
    };
  } else {
    document.getElementById('revertGate').onclick = ()=>{
      if(!confirm('This clears any answers already given in this section. Continue?')) return;
      section.items.forEach(it=>{ STATE.sectionState.answers[it.code] = undefined; STATE.sectionState.texts[it.code] = undefined; });
      if(section.sectionText) STATE.sectionState.texts[section.sectionText.code] = undefined;
      STATE.sectionState.answers[section.id] = false;
      STATE.sectionState.sectionsDone[section.id] = 'no';
      STATE.sectionIndex++;
      render();
      saveDraft();
    };
    document.querySelectorAll('button[data-code]').forEach(el=>{
      el.onclick = ()=>{
        const code = el.getAttribute('data-code');
        if(el.hasAttribute('data-toggle')){
          const alreadyTrue = STATE.sectionState.answers[code] === true;
          const group = el.getAttribute('data-group');
          const peers = group ? section.items.filter(it=>it.group===group) : section.items;
          peers.forEach(it=>{ STATE.sectionState.answers[it.code] = false; });
          STATE.sectionState.answers[code] = !alreadyTrue;
        } else {
          const value = el.getAttribute('data-value') === 'true';
          STATE.sectionState.answers[code] = value;
          // clear stale answers on any branch children if this item just went false
          if(value === false){
            section.items.forEach(it=>{
              if(it.branchFrom === code) STATE.sectionState.answers[it.code] = undefined;
            });
          }
        }
        render();
        saveDraft();
      };
    });
    document.querySelectorAll('[data-textfor]').forEach(el=>{
      el.oninput = ()=>{ STATE.sectionState.texts[el.getAttribute('data-textfor')] = el.value; };
    });
    document.querySelectorAll('[data-sectiontextfor]').forEach(el=>{
      el.oninput = ()=>{ STATE.sectionState.texts[el.getAttribute('data-sectiontextfor')] = el.value; };
    });
    if(document.getElementById('backBtn')){
      document.getElementById('backBtn').onclick = ()=>{
        STATE.sectionIndex--;
        render();
      };
    }
    const continueBtn = document.getElementById('continueBtn');
    if(continueBtn && !continueBtn.disabled){
      continueBtn.onclick = ()=>{
        const anyYes = section.items.some(it => STATE.sectionState.answers[it.code] === true);
        STATE.sectionState.sectionsDone[section.id] = anyYes ? 'yes' : 'no';
        if(anyYes) STATE.sectionState.anyYesOverall = true;
        // conflict checks (Section A)
        let warn = '';
        if(section.id==='A'){
          if(STATE.sectionState.answers.supports_rule && STATE.sectionState.answers.opposes_rule){
            STATE.sectionState.flagged = true;
            warn = 'Flagged: both "Supports rule" and "Opposes rule" checked — needs discussion.';
          }
          if(STATE.sectionState.answers.withdraw_rule && STATE.sectionState.answers.requests_change){
            STATE.sectionState.flagged = true;
            warn = (warn?warn+' ':'') + 'Flagged: both "Withdraw rule" and "Requests change" checked — do not auto-resolve, needs discussion.';
          }
        }
        if(warn){
          document.getElementById('warnBox').innerHTML = `<div class="warn">${warn}</div>`;
          setTimeout(()=>{ STATE.sectionIndex++; saveDraft(); render(); }, 900);
        } else {
          STATE.sectionIndex++;
          saveDraft();
          render();
        }
      };
    }
  }
  if(document.getElementById('backBtn') && gateAnswered!==true){
    document.getElementById('backBtn').onclick = ()=>{ STATE.sectionIndex--; render(); };
  }
  if(document.getElementById('saveProgressBtn')){
    document.getElementById('saveProgressBtn').onclick = async ()=>{
      const msgEl = document.getElementById('saveProgressMsg');
      msgEl.style.color = '';
      msgEl.textContent = 'Saving…';
      const ok = await saveDraft();
      if(ok){
        msgEl.textContent = 'Progress saved — safe to close this tab and come back later.';
      } else {

        msgEl.textContent = 'Save failed — check your internet connection and try again. Nothing has been lost on this screen, but it is not saved to the shared sheet yet.';
      }
    };
  }
  if(document.getElementById('exitReviewBtn')){
    document.getElementById('exitReviewBtn').onclick = ()=>{
      STATE.reviewMode = false;
      STATE.view = 'mylist';
      render();
    };
  }
}

function renderSummary(){
  const conf = STATE.sectionState.confidence;
  const showConfExplain = conf !== null && conf !== undefined && conf <= 3;
  const flagged = !!STATE.sectionState.flagged;
  const confOptions = [1,2,3,4,5].map(n=>{
    const cls = conf===n ? 'primary' : '';
    return `<button type="button" class="${cls}" data-conf="${n}" style="padding:6px 14px;">${n}</button>`;
  }).join('');

  app.innerHTML = `
    ${topbar(STATE.coder)}
    <div class="card chrome">
      <p class="small">All sections reviewed for this segment. Add anything below, then save.</p>

      <div class="field">
        <label>How confident are you in how you coded this segment? (1 = low, 5 = high)</label>
        <div class="btnrow" style="margin-top:2px;">${confOptions}</div>
      </div>
      ${showConfExplain ? `
      <div class="field">
        <label>You rated your confidence ${conf}/5 — briefly explain your rationale for this confidence level</label>
        <textarea id="confExplainBox">${STATE.sectionState.confidenceExplain||''}</textarea>
      </div>` : ''}

      <div class="field">
        <label><input type="checkbox" id="flagCk" ${flagged?'checked':''}/> Flag this segment for discussion</label>
      </div>
      ${flagged ? `
      <div class="field">
        <label>Coder rationale — why are you flagging this?</label>
        <textarea id="rationaleBox">${STATE.sectionState.rationale||''}</textarea>
      </div>` : ''}

      <div class="field">
        <label>Analyst memo (optional)</label>
        <textarea id="memoBox">${STATE.sectionState.memo||''}</textarea>
      </div>

      <div class="btnrow">
        <button class="ghost" id="backBtn">Back to sections</button>
        <button class="primary" id="saveBtn" ${conf?'':'disabled'}>${STATE.reviewMode ? 'Save correction' : 'Save & next segment'}</button>
      </div>
      ${conf ? '' : '<p class="small chrome">Select a confidence rating above to save.</p>'}
      <div id="saveSegmentError"></div>
    </div>
  `;
  document.querySelectorAll('[data-conf]').forEach(el=>{
    el.onclick = ()=>{
      STATE.sectionState.confidence = parseInt(el.getAttribute('data-conf'), 10);
      saveDraft();
      renderSummary();
    };
  });
  document.getElementById('flagCk').onchange = (e)=>{
    STATE.sectionState.flagged = e.target.checked;
    renderSummary();
  };
  document.getElementById('backBtn').onclick = ()=>{ STATE.sectionIndex = CODEBOOK.length-1; STATE.sectionState.sectionsDone[CODEBOOK[CODEBOOK.length-1].id] = undefined; render(); };
  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn && !saveBtn.disabled){
    saveBtn.onclick = async ()=>{
      if(document.getElementById('rationaleBox')) STATE.sectionState.rationale = document.getElementById('rationaleBox').value;
      if(document.getElementById('confExplainBox')) STATE.sectionState.confidenceExplain = document.getElementById('confExplainBox').value;
      STATE.sectionState.memo = document.getElementById('memoBox').value;
      const origLabel = saveBtn.textContent;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      const ok = await saveCurrentSegment();
      if(!ok){
        saveBtn.disabled = false;
        saveBtn.textContent = origLabel;
        document.getElementById('saveSegmentError').innerHTML =
          '<p class="small" style="color:var(--flag);">Save failed — this segment has NOT been recorded yet. Check your internet connection and click save again before leaving this screen.</p>';
        return;
      }
      document.getElementById('saveSegmentError').innerHTML = '';
      if(STATE.reviewMode){
        // Reviewing a finished segment never touched the shared draft slot, so there's
        // nothing to clear here — clearing it would risk wiping a different, still
        // in-progress segment's saved draft.
        STATE.reviewMode = false;
        STATE.view = 'mylist';
        render();
        return;
      }
      await clearDraft();
      const list = assignedList();
      const next = list.find(id => !(STATE.responses[id] && STATE.responses[id].complete));
      if(!next){ STATE.view='done'; render(); }
      else { await beginSegment(next); }
    };
  }
}

async function saveCurrentSegment(){
  const seg = currentSegmentObj();
  const record = {
    complete:true,
    commentId: seg.commentId,
    answers: STATE.sectionState.answers,
    texts: STATE.sectionState.texts,
    nonSubstantive: STATE.sectionState.nonSubstantive || null,
    flagged: !!STATE.sectionState.flagged,
    memo: STATE.sectionState.memo || '',
    rationale: STATE.sectionState.rationale || '',
    confidence: STATE.sectionState.confidence || null,
    confidenceExplain: STATE.sectionState.confidenceExplain || '',
    codedAt: new Date().toISOString()
  };
  STATE.responses[seg.segmentId] = record;
  // One small row per segment (not one growing blob per coder) — see loadCoderResponses
  // for why. Returns true/false so callers can tell the person when a save didn't land,
  // instead of silently claiming success.
  return await safeSet(responseKeyPrefix(STATE.coder)+seg.segmentId, JSON.stringify(record));
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function computeProgress(){
  const progress = {};
  for(const coder of CODERS){
    const assigned = (STATE.assignment[coder] && STATE.assignment[coder].order.length) || 0;
    const responses = await loadCoderResponses(coder);
    const completed = Object.values(responses).filter(r => r.complete).length;
    progress[coder] = { assigned, completed };
  }
  return progress;
}

async function buildExportRows(){
  const allCols = [];
  CODEBOOK.forEach(s => s.items.forEach(it => allCols.push(it.code)));
  const textCols = [];
  CODEBOOK.forEach(s => {
    s.items.forEach(it => { if(it.hasText) textCols.push(it.code+'_specify'); });
    if(s.sectionText) textCols.push(s.sectionText.code);
  });
  const legacyRes = await loadLegacyResolutions();
  const consRecs = await loadConsensusRecords();
  const resolutions = {};
  Object.keys(legacyRes).forEach(k => { resolutions[k] = { note: legacyRes[k].note }; });
  Object.keys(consRecs).forEach(k => { if(consRecs[k].decision) resolutions[k] = { note: consRecs[k].decision }; });
  const header = ['coder','commentId','segmentId','flagged','group_resolution','non_substantive','memo','rationale','confidence','confidenceExplain','codedAt'].concat(allCols).concat(textCols);
  const rows = [header];
  for(const coder of CODERS){
    const responses = await loadCoderResponses(coder);
    Object.keys(responses).forEach(segmentId=>{
      const r = responses[segmentId];
      if(!r.complete) return;
      const resolution = resolutions[segmentId] ? resolutions[segmentId].note : '';
      const row = [coder, r.commentId, segmentId, r.flagged?1:0, resolution, r.nonSubstantive||'', r.memo||'', r.rationale||'', r.confidence||'', r.confidenceExplain||'', r.codedAt||''];
      allCols.forEach(c => row.push(r.answers && r.answers[c] ? 1 : 0));
      textCols.forEach(c => { const code = c.replace('_specify',''); row.push((r.texts && r.texts[code]) || ''); });
      rows.push(row);
    });
  }
  return rows;
}

/* =========================================================
   CONSENSUS REVIEW
   One screen for the team meeting: every flagged segment and every segment
   where coders disagree, each shown once, with all coder answers side by side
   (grouped by codebook section), memos/rationales, and a place to record the
   team's final decision + discussion notes — stored SEPARATELY from the coders'
   original responses, one small row per segment (osha:consensus:<segmentId>).
   ========================================================= */
const CONSENSUS_PREFIX = 'osha:consensus:';
let CONS = { rows:[], records:{}, legacy:{}, coders:[] };

async function loadConsensusRecords(){
  const entries = await safeGetPrefix(CONSENSUS_PREFIX);
  const out = {};
  Object.keys(entries).forEach(k=>{
    try{ out[k.slice(CONSENSUS_PREFIX.length)] = JSON.parse(entries[k]); }catch(e){ /* skip a corrupt row */ }
  });
  return out;
}

// Older versions saved one shared blob of "decisions" under osha:resolutions.
// Still read it (never write to it) so nothing already typed there is lost.
async function loadLegacyResolutions(){
  const raw = await safeGet('osha:resolutions');
  if(!raw) return {};
  try{ return JSON.parse(raw); }catch(e){ return {}; }
}

// One rule for every field (gates and items alike):
//   green = every coder on this segment said Yes
//   red   = coders differ (someone said Yes, someone didn't)
//   gray  = nobody said Yes
function fieldStatus(yesFlags){
  const yes = yesFlags.filter(Boolean).length;
  if(yes === 0) return 'none';
  return yes === yesFlags.length ? 'agree' : 'disagree';
}

async function buildConsensusRows(){
  const byCoder = {};
  for(const c of CODERS) byCoder[c] = await loadCoderResponses(c);
  const segIds = new Set();
  CODERS.forEach(c => Object.keys(byCoder[c]).forEach(id => { if(byCoder[c][id].complete) segIds.add(id); }));

  const rows = [];
  segIds.forEach(segId=>{
    const entries = CODERS
      .filter(c => byCoder[c][segId] && byCoder[c][segId].complete)
      .map(c => ({ coder:c, r:byCoder[c][segId] }));
    const notYetCoded = CODERS.filter(c =>
      STATE.assignment[c] && STATE.assignment[c].order.indexOf(segId) !== -1 &&
      !(byCoder[c][segId] && byCoder[c][segId].complete));
    const flaggers = entries.filter(e => e.r.flagged);

    let total = 0;
    const sections = CODEBOOK.map(sec=>{
      const gateVals = entries.map(e => e.r.answers ? e.r.answers[sec.id] : undefined);
      const gateStatus = fieldStatus(gateVals.map(v => v === true));
      const items = sec.items.map(it=>{
        const cells = entries.map(e=>{
          const gateYes = !!(e.r.answers && e.r.answers[sec.id] === true);
          const yes = !!(e.r.answers && e.r.answers[it.code] === true);
          return { coder:e.coder, val: yes ? 'yes' : (gateYes ? 'no' : 'na'),
                   text: (it.hasText && e.r.texts && e.r.texts[it.code]) ? e.r.texts[it.code] : '' };
        });
        return { item:it, cells, status: fieldStatus(cells.map(c => c.val === 'yes')) };
      });
      const sectionText = sec.sectionText ? entries.map(e => ({
        coder:e.coder, text: (e.r.texts && e.r.texts[sec.sectionText.code]) || ''
      })).filter(x => x.text) : [];
      const dis = (gateStatus === 'disagree' ? 1 : 0) + items.filter(i => i.status === 'disagree').length;
      total += dis;
      const anyYes = gateVals.some(v => v === true);
      return { sec, gateVals, gateStatus, items, sectionText, dis, anyYes };
    });

    // Section L (non-substantive check) — only matters if someone used it
    const nsVals = entries.map(e => e.r.nonSubstantive || null);
    const nsUsed = nsVals.some(Boolean);
    const nsDisagree = nsUsed && !nsVals.every(v => v === nsVals[0]);
    if(nsDisagree) total += 1;

    if(flaggers.length === 0 && total === 0) return;   // nothing to discuss

    const seg = STATE.segments.find(s => s.segmentId === segId);
    rows.push({
      segmentId: segId,
      commentId: seg ? seg.commentId : (entries[0] && entries[0].r.commentId) || '(unknown)',
      text: seg ? seg.text : '(segment text unavailable — reload segment data)',
      order: seg ? STATE.segments.indexOf(seg) : 1e9,
      entries, notYetCoded, flaggers, sections, totalDisagree: total,
      nsUsed, nsVals, nsDisagree
    });
  });
  rows.sort((a,b) => a.order - b.order);
  return rows;
}

function firstName(n){ return n.split(' ')[0]; }
function valLabel(v){ return v === 'yes' ? 'Yes' : v === 'no' ? 'No' : '—'; }

function consFinalSelect(segId, key, rec){
  const cur = rec && rec.final && key in rec.final ? (rec.final[key] ? 'yes' : 'no') : '';
  return `<select data-final="${escapeHtml(key)}" aria-label="Team decision">
    <option value=""${cur===''?' selected':''}>undecided</option>
    <option value="yes"${cur==='yes'?' selected':''}>Yes</option>
    <option value="no"${cur==='no'?' selected':''}>No</option>
  </select>`;
}

function consSectionHtml(row, S, rec){
  const sec = S.sec;
  const head = `<tr><th>${sec.id} · ${escapeHtml(sec.title)}</th>${row.entries.map(e=>`<th title="${escapeHtml(e.coder)}">${escapeHtml(firstName(e.coder))}</th>`).join('')}<th>Team decision</th></tr>`;
  const gateRow = `<tr class="gate-row c-${S.gateStatus}">
      <th>Gate: ${escapeHtml(sec.gate)}</th>
      ${S.gateVals.map(v => `<td>${v===true?'Yes':v===false?'No':'—'}</td>`).join('')}
      <td class="final">${S.gateStatus==='disagree' ? consFinalSelect(row.segmentId, 'gate:'+sec.id, rec) : ''}</td>
    </tr>`;
  // Nobody said Yes to the gate and nobody disagrees: one compact line instead of a wall of gray.
  if(!S.anyYes && S.dis === 0){
    return `<table class="cons-table"><thead>${head}</thead><tbody>${gateRow}</tbody></table>`;
  }
  const itemRows = S.items.map(i => `<tr class="c-${i.status}">
      <th>${escapeHtml(i.item.label)}</th>
      ${i.cells.map(c => `<td>${valLabel(c.val)}${c.text ? ': “'+escapeHtml(c.text)+'”' : ''}</td>`).join('')}
      <td class="final">${i.status==='disagree' ? consFinalSelect(row.segmentId, i.item.code, rec) : ''}</td>
    </tr>`).join('');
  const textRows = (S.sectionText.length && sec.sectionText)
    ? `<tr><th>${escapeHtml(sec.sectionText.label)}</th><td colspan="${row.entries.length+1}">${S.sectionText.map(x=>`<strong>${escapeHtml(firstName(x.coder))}:</strong> ${escapeHtml(x.text)}`).join(' &nbsp;·&nbsp; ')}</td></tr>`
    : '';
  return `<table class="cons-table"><thead>${head}</thead><tbody>${gateRow}${itemRows}${textRows}</tbody></table>`;
}

function consCardHtml(row){
  const rec = CONS.records[row.segmentId] || null;
  const legacyNote = (!rec && CONS.legacy[row.segmentId]) ? (CONS.legacy[row.segmentId].note || '') : '';
  const status = rec && rec.status === 'resolved' ? 'resolved' : 'open';

  const why = [];
  if(row.flaggers.length) why.push(`<span class="cons-tag flag">Flagged by ${row.flaggers.map(f=>escapeHtml(firstName(f.coder))).join(', ')}</span>`);
  if(row.totalDisagree) why.push(`<span class="cons-tag dis">${row.totalDisagree} field${row.totalDisagree===1?'':'s'} in disagreement</span>`);
  if(row.entries.length < 2) why.push(`<span class="cons-tag">Only 1 coder finished so far</span>`);

  const memoBlocks = row.entries.filter(e => e.r.memo || (e.r.flagged && (e.r.rationale || e.r.confidenceExplain)) || e.r.nonSubstantive)
    .map(e=>{
      const parts = [];
      if(e.r.flagged){
        parts.push(`<em>Flag rationale${e.r.confidence?' (confidence '+e.r.confidence+'/5)':''}:</em> ${escapeHtml(e.r.rationale || e.r.confidenceExplain || 'no text given')}`);
      }
      if(e.r.memo) parts.push(`<em>Memo:</em> ${escapeHtml(e.r.memo)}`);
      if(e.r.nonSubstantive) parts.push(`<em>Non-substantive check:</em> ${escapeHtml(e.r.nonSubstantive)}`);
      return `<div class="cons-note"><strong>${escapeHtml(e.coder)}</strong><br>${parts.join('<br>')}</div>`;
    }).join('');

  const nsRow = row.nsUsed ? `<p class="small chrome" style="background:${row.nsDisagree?'var(--disagree-bg)':'var(--agree-bg)'};padding:4px 8px;">Non-substantive check (Section L): ${row.entries.map((e,i)=>escapeHtml(firstName(e.coder))+' — '+(row.nsVals[i]||'not used')).join(' · ')}</p>` : '';

  const missing = row.notYetCoded.length
    ? `<p class="small chrome" style="color:var(--flag);">Assigned but not coded: ${row.notYetCoded.map(escapeHtml).join(', ')}</p>` : '';

  return `
  <div class="card cons-card" data-seg="${escapeHtml(row.segmentId)}" data-status="${status}" data-flagged="${row.flaggers.length?1:0}" data-disagree="${row.totalDisagree?1:0}" data-complete="${row.notYetCoded.length===0?1:0}">
    <div class="small chrome"><strong>${escapeHtml(row.commentId)} · ${escapeHtml(row.segmentId)}</strong> ${why.join('')}
      <span class="cons-tag ${status==='resolved'?'ok':''}" data-status-tag>${status==='resolved'?'Resolved':'Open'}</span></div>
    <div class="segment-text" style="font-size:1.02rem;">${escapeHtml(row.text)}</div>
    <p class="small chrome">Coded by: ${row.entries.map(e=>escapeHtml(e.coder)).join(', ')}</p>
    ${missing}
    ${memoBlocks}
    ${nsRow}
    ${row.sections.map(S => consSectionHtml(row, S, rec)).join('')}
    <hr class="divider">
    <div class="chrome">
      <div class="field"><label>Final decision (what the team agreed, and why)</label>
        <textarea data-f="decision">${escapeHtml((rec && rec.decision) || legacyNote)}</textarea>
        ${legacyNote ? '<div class="small">Pre-filled from an earlier saved decision — saving here moves it to the new record.</div>' : ''}</div>
      <div class="field"><label>Discussion notes</label>
        <textarea data-f="discussion">${escapeHtml((rec && rec.discussion) || '')}</textarea></div>
      <div class="btnrow">
        <label class="small">Status
          <select data-f="status"><option value="open"${status==='open'?' selected':''}>Open</option><option value="resolved"${status==='resolved'?' selected':''}>Resolved</option></select></label>
        <label class="small">Recorded by
          <select data-f="by"><option value="">—</option>${CODERS.map(c=>`<option${rec&&rec.recordedBy===c?' selected':''}>${escapeHtml(c)}</option>`).join('')}</select></label>
        <button class="primary" data-cons-save>Save</button>
        <span class="small" data-cons-msg>${rec && rec.savedAt ? 'Last saved '+new Date(rec.savedAt).toLocaleString() : ''}</span>
      </div>
    </div>
  </div>`;
}

function consUpdateSummary(){
  const total = CONS.rows.length;
  const resolved = CONS.rows.filter(r => CONS.records[r.segmentId] && CONS.records[r.segmentId].status === 'resolved').length;
  const el = document.getElementById('consSummary');
  if(el) el.textContent = `${total} segment(s) to review · ${resolved} resolved · ${total-resolved} open`;
}

function consApplyFilter(f){
  document.querySelectorAll('.cons-card').forEach(card=>{
    let show = true;
    if(f === 'open') show = card.dataset.status === 'open';
    if(f === 'resolved') show = card.dataset.status === 'resolved';
    if(f === 'flagged') show = card.dataset.flagged === '1';
    if(f === 'disagree') show = card.dataset.disagree === '1';
    if(f === 'complete') show = card.dataset.complete === '1';
    card.style.display = show ? '' : 'none';
  });
  document.querySelectorAll('[data-cons-filter]').forEach(b => b.classList.toggle('primary', b.dataset.consFilter === f));
}

function consensusCsv(){
  const codes = [];
  CODEBOOK.forEach(s => { codes.push('gate:'+s.id); s.items.forEach(it => codes.push(it.code)); });
  const header = ['segmentId','commentId','why_included','fields_in_disagreement','status','final_decision','discussion_notes','recorded_by','saved_at']
    .concat(codes.map(c => 'final_'+c.replace(':','_')));
  const out = [header];
  CONS.rows.forEach(r=>{
    const rec = CONS.records[r.segmentId] || {};
    const why = [];
    if(r.flaggers.length) why.push('flagged by ' + r.flaggers.map(f=>f.coder).join(' + '));
    if(r.totalDisagree) why.push(r.totalDisagree + ' field(s) in disagreement');
    const disCodes = [];
    r.sections.forEach(S => {
      if(S.gateStatus === 'disagree') disCodes.push('gate:'+S.sec.id);
      S.items.forEach(i => { if(i.status === 'disagree') disCodes.push(i.item.code); });
    });
    out.push([r.segmentId, r.commentId, why.join('; '), disCodes.join(' '), rec.status || 'open',
              rec.decision||'', rec.discussion||'', rec.recordedBy||'', rec.savedAt||'']
      .concat(codes.map(c => rec.final && c in rec.final ? (rec.final[c] ? 1 : 0) : '')));
  });
  return rowsToCsv(out);
}

async function renderConsensus(){
  app.innerHTML = `${topbar('Consensus review')}<div class="card chrome"><p class="small">Loading every coder's responses from the sheet…</p></div>`;
  BACKEND_READ_ERRORS = 0;
  CONS.records = await loadConsensusRecords();
  CONS.legacy = await loadLegacyResolutions();
  CONS.rows = await buildConsensusRows();

  app.innerHTML = `
    ${topbar('Consensus review')}
    ${BACKEND_READ_ERRORS > 0 ? backendReadWarning() : ''}
    <div class="card chrome">
      <p id="consSummary" style="margin:0 0 8px;"></p>
      <p class="cons-legend small" style="margin:0 0 10px;">
        <span style="background:var(--agree-bg)">Green: everyone said Yes</span>
        <span style="background:var(--disagree-bg)">Red: coders differ</span>
        <span style="background:var(--none-bg)">Gray: nobody said Yes</span>
        <span>“—” = coder's gate was No, so this item wasn't asked</span></p>
      <div class="btnrow">
        <button data-cons-filter="all" class="primary">All</button>
        <button data-cons-filter="open">Open</button>
        <button data-cons-filter="resolved">Resolved</button>
        <button data-cons-filter="flagged">Flagged</button>
        <button data-cons-filter="disagree">Disagreements</button>
        <button data-cons-filter="complete">All assigned coders finished</button>
        <button id="consCsvBtn">Download review list + team decisions (CSV)</button>
        <button id="consReload">Reload from sheet</button>
      </div>
      <label class="small" style="display:block;margin-top:8px;"><input type="checkbox" id="consHideGray"> Hide gray rows (fields nobody said Yes to) to shorten each segment. This only changes what you see on screen; it does not change any data or the download.</label>
      <div id="consCsvArea"></div>
    </div>
    ${CONS.rows.length ? CONS.rows.map(consCardHtml).join('') : '<div class="card chrome"><p>Nothing to review yet — no segment is flagged or has a disagreement between completed coders.</p></div>'}
    <footer class="foot"><a id="consBack">Back to Admin</a></footer>
  `;
  consUpdateSummary();
  document.getElementById('consBack').onclick = ()=>{ STATE.view='admin'; render(); };
  document.getElementById('consReload').onclick = ()=>{ if(confirm('Reload from the sheet? Any unsaved typing on this screen will be lost.')) renderConsensus(); };
  document.querySelectorAll('[data-cons-filter]').forEach(b => b.onclick = ()=> consApplyFilter(b.dataset.consFilter));
  document.getElementById('consHideGray').onchange = (ev)=>{ app.classList.toggle('cons-hide-gray', ev.target.checked); };
  document.getElementById('consCsvBtn').onclick = ()=>{
    const url = URL.createObjectURL(new Blob([consensusCsv()], {type:'text/csv'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'osha_consensus_review.csv';
    document.body.appendChild(a); a.click(); a.remove();
    const decided = CONS.rows.filter(r => CONS.records[r.segmentId]).length;
    document.getElementById('consCsvArea').innerHTML = `<p class="small">Downloaded ${CONS.rows.length} segment(s) — ${decided} with a saved team decision, ${CONS.rows.length - decided} not decided yet. (If nothing arrived, check your browser's downloads.)</p>`;
  };

  document.querySelectorAll('.cons-card').forEach(card=>{
    const segId = card.dataset.seg;
    const btn = card.querySelector('[data-cons-save]');
    const msg = card.querySelector('[data-cons-msg]');
    btn.onclick = async ()=>{
      const final = {};
      card.querySelectorAll('select[data-final]').forEach(sel=>{
        if(sel.value === 'yes') final[sel.dataset.final] = true;
        else if(sel.value === 'no') final[sel.dataset.final] = false;
      });
      const undecided = card.querySelectorAll('select[data-final]').length - Object.keys(final).length;
      const rec = {
        status: card.querySelector('[data-f="status"]').value,
        decision: card.querySelector('[data-f="decision"]').value,
        discussion: card.querySelector('[data-f="discussion"]').value,
        recordedBy: card.querySelector('[data-f="by"]').value,
        final, savedAt: new Date().toISOString()
      };
      btn.disabled = true; msg.style.color = ''; msg.textContent = 'Saving…';
      const ok = await safeSet(CONSENSUS_PREFIX + segId, JSON.stringify(rec));
      btn.disabled = false;
      if(!ok){
        msg.style.color = 'var(--flag)';
        msg.textContent = 'NOT saved — check your connection and click Save again. Your text is still on screen.';
        return;
      }
      CONS.records[segId] = rec;
      card.dataset.status = rec.status;
      const tag = card.querySelector('[data-status-tag]');
      tag.textContent = rec.status === 'resolved' ? 'Resolved' : 'Open';
      tag.classList.toggle('ok', rec.status === 'resolved');
      msg.textContent = 'Saved ' + new Date(rec.savedAt).toLocaleTimeString() +
        (rec.status === 'resolved' && undecided ? ` — note: ${undecided} red field(s) still have no team decision.` : '');
      consUpdateSummary();
    };
  });
}

function rowsToCsv(rows){
  return rows.map(r => r.map(cell=>{
    const s = String(cell===undefined||cell===null ? '' : cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}

init();
</script>
