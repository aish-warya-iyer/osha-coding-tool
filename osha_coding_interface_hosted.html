<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSHA Heat Rule — Segment Coding</title>
<style>
  :root{
    --paper:#F3F1EA;
    --paper-raised:#FBFAF6;
    --ink:#1E2A22;
    --ink-soft:#4A564C;
    --rule:#C9C3B4;
    --accent:#2F4D63;
    --accent-soft:#DCE6EA;
    --flag:#9A5B2E;
    --flag-soft:#F3E3D3;
    --good:#3C6E4E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    line-height:1.5;
  }
  .chrome{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  #app{
    max-width:680px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.topbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--rule);
    padding-bottom:14px;
    margin-bottom:24px;
  }
  header.topbar h1{
    font-size:1.15rem;
    margin:0;
    font-weight:normal;
    letter-spacing:0.2px;
  }
  header.topbar .meta{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:20px 22px;
    margin-bottom:18px;
  }
  .segment-text{
    font-size:1.18rem;
    line-height:1.6;
    padding:4px 2px;
  }
  .segment-label{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .section-tag{
    display:inline-block;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.74rem;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:2px;
    padding:1px 7px;
    margin-bottom:10px;
  }
  .gate-question, .item-q{
    font-size:1.02rem;
  }
  .btnrow{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  button{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.92rem;
    border-radius:3px;
    border:1px solid var(--accent);
    background:var(--paper-raised);
    color:var(--accent);
    padding:9px 18px;
    cursor:pointer;
  }
  button.primary{
    background:var(--accent);
    color:#fff;
  }
  button.ghost{
    border-color:var(--rule);
    color:var(--ink-soft);
  }
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button:hover{filter:brightness(0.97);}
  button:disabled{opacity:0.4; cursor:not-allowed; filter:none;}
  .items-list{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.92rem;
    padding-left:0;
  }
  .item-row.branch{
    margin-left:26px;
    color:var(--ink-soft);
  }
  .item-row input[type=checkbox], .item-row input[type=radio]{
    margin-top:3px;
  }
  .item-row .label{font-weight:600;}
  .item-row .q{color:var(--ink-soft); font-weight:normal;}
  textarea, input[type=text], select{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.9rem;
    width:100%;
    border:1px solid var(--rule);
    border-radius:3px;
    padding:8px 10px;
    background:#fff;
    color:var(--ink);
  }
  textarea{min-height:60px; resize:vertical;}
  .progress{
    display:flex;
    gap:4px;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.68rem;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .progress span{
    border:1px solid var(--rule);
    border-radius:2px;
    padding:2px 6px;
    color:var(--ink-soft);

  .progress span.skipped{ color:#B8B2A2; text-decoration:line-through; }

    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:12px;

    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.82rem;

  }

    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  }
  footer.foot{

    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.76rem;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .divider{border:none; border-top:1px solid var(--rule); margin:20px 0;}
  table.admin-table{

    font-size:0.82rem;
  }

  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-bottom:4px;

</style>

      {code:'structural_vulnerability', label:'Structural vulnerability', q:'Does this segment tie vulnerability to systemic factors (immigration status, labor power, economic dependence)?'},

      {code:'backfires_on_workers', label:'Backfires on workers', q:'Does this segment argue the rule would harm the very workers it is meant to protect?'},

      {code:'stats_studies', label:'Stats/studies', q:'Does this segment support its claim with data, statistics, or research findings?'},
      {code:'laws_regs_cited', label:'Laws/regs cited', q:'Does this segment support its claim by citing a specific law/regulation (incl. a state ban/preemption)?'},
      {code:'others_stories', label:"Others' stories", q:"Does this segment support its claim with someone else's story or case?"},
      {code:'institutional_knowledge', label:'Institutional knowledge', q:'Does this segment support its claim with general industry/operational knowledge (no formal citation)?'},
      {code:'no_evidence', label:'No evidence', q:'Does this segment make a claim with no evidence/citation/warrant at all?'},
      {code:'lived_experience', label:'Lived experience (authority)', q:"Does this segment ground the commenter's authority in their own firsthand experience?"},
      {code:'expertise', label:'Expertise', q:"Does this segment ground authority in the commenter's professional role/training/specialized knowledge?"},
      {code:'org_authority', label:'Org authority', q:'Does this segment ground authority in representing an organization/membership/official capacity?'},
      {code:'scientific_credibility', label:'Scientific credibility', q:"Does this segment ground authority in research/data as the basis for the commenter's own credibility?"},
      {code:'legal_authority', label:'Legal authority', q:'Does this segment ground authority in law/regulation/legal expertise?'},
      {code:'moral_authority', label:'Moral authority', q:'Does this segment ground authority in ethical/moral standing rather than experience or role?'},
      {code:'solidarity_f', label:'Solidarity', q:'Does this segment ground authority in group membership/shared identity with those affected?'},
      {code:'heritage_tradition', label:'Heritage/tradition', q:'Does this segment ground authority/credibility in tradition, heritage, or a revered historical figure/quotation?'},
    ]},
  { id:'G', title:'Death imagery, named individuation',
    gate:'Does this segment mention death/fatality, or name a specific real person/incident for rhetorical effect?',
    items:[
      {code:'death_imagery', label:'Death imagery', q:'Does this segment mention death, mortality, fatality, or fatal heat illness?'},
      {code:'names_person_incident', label:'Names person/incident', q:'Does this segment name a specific real person, incident, or entity — as victim or wrongdoer — to make the argument feel more concrete, vivid, or urgent?', hasText:true, textLabel:'Who/what is named'},
    ]},
  { id:'H', title:'Delegitimizing opponents', sectionText:{code:'delegitimation_target', label:'Who or what is being delegitimized?'},
    gate:'Does this segment attempt to delegitimize an opposing stakeholder or the agency itself?',
    items:[
      {code:'emotional_anecdotal', label:'Emotional/anecdotal', q:'Does this segment dismiss an opposing view as merely emotional/anecdotal/unscientific?'},
      {code:'biased_self_interested', label:'Biased/self-interested', q:'Does this segment frame opposing stakeholders as biased/self-interested?'},
      {code:'unqualified', label:'Unqualified', q:"Does this segment question an opposing stakeholder's (not the agency's) qualifications/competence?"},
      {code:'agency_process', label:'Agency process', q:"Does this segment challenge OSHA/the agency's own rulemaking process, analysis, or competence?"},
    ]},
  { id:'I', title:'Temporal frame', single:true,

      {code:'precedent_appeal', label:'Precedent appeal', q:'Does this segment invoke history, tradition, or continuity to lend weight to the claim?'},
      {code:'forward_projection', label:'Forward projection', q:'Does this segment project forward to a risk, consequence, or recommendation contingent on future action/inaction?'},
    ]},
  { id:'J', title:'Emotional register', single:true,

    items:[

      {code:'measured_technical', label:'Measured/technical', q:"Does this segment's tone read as measured, technical, or matter-of-fact?"},
      {code:'angry_oppositional', label:'Angry/oppositional', q:"Does this segment's tone read as angry or oppositional?"},

const CODERS = ['Kaitlyn','Mikayla','Joe','Fiona Bradbury','Andrea Juarbe'];
const MIN_CODERS_PER_SEGMENT = 3;

const SAMPLE_SEGMENTS = [
  {commentId:'OSHA-2021-0009-5281', segmentId:'seg_5281_1', text:'In recent years, record-high temperatures have been seen across the country. These extreme temperatures injure and kill workers each year.'},
  {commentId:'OSHA-2021-0009-5281', segmentId:'seg_5281_2', text:'Farm workers are as much as 35 times more likely to be killed by heat than any other civilian occupation.'},
  {commentId:'OSHA-2021-0009-5281', segmentId:'seg_5281_3', text:"Heat deaths are preventable tragedies. The solution isn't complicated: training, shade, cool water and paid rest breaks."},
  {commentId:'OSHA-2021-0009-22533', segmentId:'seg_22533_1', text:"We strongly oppose the Department of Labor's proposed Heat Injury and Illness rule."},
  {commentId:'OSHA-2021-0009-22532', segmentId:'seg_22532_1', text:'With tight margins and rising compliance costs across this complicated regulatory scheme, small and medium-sized farms may struggle to afford these mandates.'},
  {commentId:'OSHA-2021-0009-22532', segmentId:'seg_22532_2', text:'I urge OSHA to consider these challenges and to collaborate with the agriculture industry to develop practical, cost-effective, and flexible solutions that balance worker safety with the realities of agricultural work.'},
];

/* =========================================================
   STATE
   ========================================================= */
let STATE = {
  segments: [],          // [{commentId, segmentId, text}]
  assignment: {},        // { coderName: { order: [segmentId,...] } }
  coder: null,
  responses: {},         // { segmentId: {...record} } for current coder
  currentSegmentId: null,
  sectionIndex: 0,
  sectionState: {},       // working answers for the segment currently being coded
  view: 'loading'
};

const app = document.getElementById('app');

/* =========================================================
   BACKEND — Google Sheets via Apps Script Web App
   Paste your deployed web app URL (ends in /exec) below.
   See the setup instructions that came with this file.
   ========================================================= */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3kTDVgVT4vdffJFdd-iC41cMZDCp-br_E53NzF4TOgiLSvsry4pD2fBsSW68xzUja/exec';

function backendConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === -1;
}

async function safeGet(key){
  if(!backendConfigured()) return null;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(key));
    const data = await res.json();
    return (data && data.value != null) ? data.value : null;
  }catch(e){ console.error('safeGet failed', e); return null; }
}
async function safeSet(key, value){
  if(!backendConfigured()) return false;
  try{
    // NOTE: body is sent as a plain string (no custom headers) on purpose —
    // this keeps it a CORS "simple request" so the browser doesn't send a
    // preflight OPTIONS call, which Apps Script web apps don't handle.
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'set', key, value })
    });
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){ console.error('safeSet failed', e); return false; }
}
async function safeList(prefix){
  if(!backendConfigured()) return [];
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=list&prefix=' + encodeURIComponent(prefix||''));
    const data = await res.json();
    return (data && data.keys) ? data.keys : [];
  }catch(e){ console.error('safeList failed', e); return []; }
}
async function safeDelete(key){
  if(!backendConfigured()) return false;
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'delete', key })
    });
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){ console.error('safeDelete failed', e); return false; }
}
async function testBackend(){
  if(!backendConfigured()) return {ok:false, msg:'Apps Script URL not set yet — edit APPS_SCRIPT_URL near the top of the <script> block.'};
  const testKey = 'osha:_connection_test';
  const testVal = 'ping-'+Date.now();
  const setOk = await safeSet(testKey, testVal);
  if(!setOk) return {ok:false, msg:'Could not write to the sheet. Check the deployment is "Anyone" access and the URL ends in /exec.'};
  const got = await safeGet(testKey);
  if(got !== testVal) return {ok:false, msg:'Wrote OK but read back a mismatch — check the Apps Script code matches the provided version.'};
  return {ok:true, msg:'Connected. Read/write to the sheet is working.'};
}

/* =========================================================
   INIT
   ========================================================= */
async function init(){
  const segRaw = await safeGet('osha:segments');
  STATE.segments = segRaw ? JSON.parse(segRaw) : [];
  const asgRaw = await safeGet('osha:assignment');
  STATE.assignment = asgRaw ? JSON.parse(asgRaw) : {};
  STATE.view = 'select';
  render();
}

/* =========================================================
   ASSIGNMENT GENERATION — balanced random, min 3 of 5 coders per segment
   ========================================================= */
function generateAssignment(){
  const counts = {}; CODERS.forEach(c => counts[c] = 0);
  const perSegment = {}; // segmentId -> [coders]
  STATE.segments.forEach(seg => {
    const ranked = CODERS.slice().sort((a,b)=>{
      const d = counts[a]-counts[b];
      return d !== 0 ? d : (Math.random()-0.5);
    });
    const chosen = ranked.slice(0, MIN_CODERS_PER_SEGMENT);
    chosen.forEach(c => counts[c]++);
    perSegment[seg.segmentId] = chosen;
  });
  const assignment = {};
  CODERS.forEach(c => {
    const mySegs = STATE.segments.filter(s => perSegment[s.segmentId].includes(c)).map(s=>s.segmentId);
    // shuffle order per coder
    for(let i = mySegs.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [mySegs[i],mySegs[j]] = [mySegs[j],mySegs[i]];
    }
    assignment[c] = { order: mySegs };
  });
  return assignment;
}

/* =========================================================
   RENDER: ROUTER
   ========================================================= */
function render(){
  if(STATE.view === 'select') return renderSelect();
  if(STATE.view === 'admin') return renderAdmin();
  if(STATE.view === 'code') return renderCode();
  if(STATE.view === 'done') return renderDone();
  if(STATE.view === 'nosegs') return renderNoSegs();
}

function topbar(subtitle){
  return `<header class="topbar chrome">
    <h1>OSHA Heat Rule — Segment Coding</h1>
    <span class="meta">${subtitle||''}</span>
  </header>`;
}

/* ---------- Coder select screen ---------- */
function renderSelect(){
  const options = CODERS.map(c=>`<option value="${c}">${c}</option>`).join('');
  const warnBanner = !backendConfigured() ? `<div class="warn chrome" style="margin-bottom:14px;">Backend not configured yet — go to Admin / setup and paste in the Apps Script URL before anyone starts coding.</div>` : '';
  app.innerHTML = `
    ${topbar('Codebook v3.0 — pilot')}
    ${warnBanner}
    <div class="card chrome">
      <div class="field">
        <label>Who is coding?</label>
        <select id="coderSelect">
          <option value="">Select your name…</option>
          ${options}
        </select>
      </div>

        <button class="primary" id="startBtn">Start coding</button>
      </div>
    </div>
    <footer class="foot"><a id="adminLink">Admin / setup</a></footer>
  `;
  document.getElementById('startBtn').onclick = async ()=>{

    if(!val) return;
    STATE.coder = val;
    const respRaw = await safeGet('osha:responses:'+val);
    STATE.responses = respRaw ? JSON.parse(respRaw) : {};

    ${topbar(STATE.coder||'')}

}

function renderDone(){

    ${topbar(STATE.coder||'')}
    <div class="card chrome">
      <p>You've completed all segments assigned to you. Thank you!</p>
      <div class="btnrow"><button class="ghost" id="back">Switch coder</button></div>
    </div>

  document.getElementById('back').onclick = ()=>{ STATE.view='select'; render(); };

/* ---------- Coding screen ---------- */
function draftKey(){ return 'osha:draft:'+STATE.coder; }

async function saveDraft(){
  const draft = { segmentId: STATE.currentSegmentId, sectionIndex: STATE.sectionIndex, sectionState: STATE.sectionState };
  await safeSet(draftKey(), JSON.stringify(draft));
}
async function clearDraft(){
  await safeDelete(draftKey());
}

async function beginSegment(segmentId){
  STATE.currentSegmentId = segmentId;
  STATE.sectionIndex = 0;
  STATE.sectionState = { answers:{}, texts:{}, sectionsDone:{}, sectionAnyYes:false, anyYesOverall:false, flagged:false, memo:'', rationale:'', confidence:null, confidenceExplain:'' };

  const draftRaw = await safeGet(draftKey());
  if(draftRaw){
    try{
      const draft = JSON.parse(draftRaw);
      if(draft.segmentId === segmentId){
        STATE.sectionIndex = draft.sectionIndex;
        STATE.sectionState = draft.sectionState;
        STATE.justResumed = true;
      }
    }catch(e){ /* ignore a corrupt draft, start fresh */ }
  }
  STATE.view = 'code';
  render();
}

function currentSegmentObj(){
  return STATE.segments.find(s=>s.segmentId===STATE.currentSegmentId);
}

function assignedList(){
  return (STATE.assignment[STATE.coder] && STATE.assignment[STATE.coder].order) || [];
}

function renderCode(){
  const seg = currentSegmentObj();
  const list = assignedList();
  const doneCount = list.filter(id => STATE.responses[id] && STATE.responses[id].complete).length;

  if(STATE.sectionIndex >= CODEBOOK.length){
    return renderSectionL();
  }

  const section = CODEBOOK[STATE.sectionIndex];
  const gateAnswered = section.id in STATE.sectionState.answers ? STATE.sectionState.answers[section.id] : null;

  const progressHtml = CODEBOOK.map((s,i)=>{
    let cls = '';
    if(i < STATE.sectionIndex) cls = STATE.sectionState.sectionsDone[s.id]==='yes' ? 'done' : 'skipped';
    if(i === STATE.sectionIndex) cls = 'current';
    return `<span class="${cls}">${s.id}</span>`;
  }).join('');

  function visibleItems(){
    return section.items.filter(item => !item.branchFrom || STATE.sectionState.answers[item.branchFrom] === true);
  }
  function sectionComplete(){
    const vis = visibleItems();
    if(section.single || section.singleWithinGroup) return vis.some(it => STATE.sectionState.answers[it.code] === true);
    return vis.every(it => STATE.sectionState.answers[it.code] === true || STATE.sectionState.answers[it.code] === false);
  }

  let itemsHtml = '';
  if(gateAnswered === true){
    const modeNote = section.single ? 'Select the one option that best fits — this section is single-select.'
      : section.singleWithinGroup ? 'For each group below, pick at most one option. A segment can have one from each group (e.g. one victim AND one antagonist) — just not two within the same group.'
      : 'Answer Yes or No for every item below — each is its own question, not a checklist.';

    const groupLabels = {victim:'Victim', protagonist:'Protagonist', antagonist:'Antagonist'};

    function renderItemRow(item){
      const current = STATE.sectionState.answers[item.code]; // true, false, or undefined
      const rowClass = item.branchFrom ? 'item-row branch' : 'item-row';
      let textField = '';
      if(item.hasText && current === true){
        textField = `<div style="margin-left:26px;margin-top:4px;">
          <input type="text" placeholder="${item.textLabel||'Specify'}" data-textfor="${item.code}" value="${(STATE.sectionState.texts[item.code]||'').replace(/"/g,'&quot;')}"/>
        </div>`;
      }
      let buttonsHtml;
      if(section.single || section.singleWithinGroup){
        const selCls = current === true ? 'primary' : '';
        const groupAttr = item.group ? ` data-group="${item.group}"` : '';
        buttonsHtml = `<button type="button" class="${selCls}" data-code="${item.code}" data-toggle="true"${groupAttr} style="padding:5px 12px;">${current===true ? 'Selected' : 'Select'}</button>`;
      } else {
        const yesCls = current === true ? 'primary' : '';
        const noCls = current === false ? 'primary' : '';
        buttonsHtml = `<button type="button" class="${yesCls}" data-code="${item.code}" data-value="true" style="padding:5px 12px;">Yes</button>
            <button type="button" class="${noCls}" data-code="${item.code}" data-value="false" style="padding:5px 12px;">No</button>`;
      }
      return `<div class="${rowClass}">
          <div style="flex:1;"><span class="label">${item.label}</span><br><span class="q">${item.q}</span></div>
          <div style="display:flex;gap:6px;flex-shrink:0;">${buttonsHtml}</div>
        </div>${textField}`;
    }

    let bodyHtml;
    if(section.singleWithinGroup){
      const groups = [];
      visibleItems().forEach(it=>{ if(!groups.includes(it.group)) groups.push(it.group); });
      bodyHtml = groups.map(g=>{
        const groupItems = visibleItems().filter(it=>it.group===g);
        return `<div class="small chrome" style="margin-top:12px;margin-bottom:2px;font-weight:600;">${groupLabels[g]||g}</div>` + groupItems.map(renderItemRow).join('');
      }).join('');
    } else {
      bodyHtml = visibleItems().map(renderItemRow).join('');
    }

    let sectionTextHtml = '';
    if(section.sectionText && section.items.some(it => STATE.sectionState.answers[it.code] === true)){
      const st = section.sectionText;
      sectionTextHtml = `<div class="field" style="margin-top:10px;">
        <label>${st.label}</label>
        <input type="text" data-sectiontextfor="${st.code}" value="${(STATE.sectionState.texts[st.code]||'').replace(/"/g,'&quot;')}"/>
      </div>`;
    }

    itemsHtml = `<p class="small chrome">${modeNote}</p>
    <div class="items-list">${bodyHtml}</div>
    ${sectionTextHtml}
    <div class="btnrow"><button class="primary" id="continueBtn" ${sectionComplete()?'':'disabled'}>Continue</button></div>
    ${sectionComplete() ? '' : '<p class="small chrome">Answer every item above to continue.</p>'}
    <div id="warnBox"></div>`;
  }

  const resumeBanner = STATE.justResumed ? `<div class="flagbar chrome" style="color:var(--good);background:#E5F0E9;border-color:var(--good);">Resumed where you left off on this segment.</div>` : '';
  STATE.justResumed = false;

  app.innerHTML = `
    ${topbar(`${STATE.coder} · segment ${doneCount+1} of ${list.length}`)}
    ${resumeBanner}
    <div class="progress chrome">${progressHtml}</div>
    <div class="card">
      <div class="segment-label chrome">Segment text (comment identity hidden)</div>
      <div class="segment-text">${escapeHtml(seg.text)}</div>
    </div>
    <div class="card chrome">
      <span class="section-tag">Section ${section.id} — ${section.title}</span>
      <div class="gate-question">${section.gate}</div>
      ${gateAnswered===true ? `<div class="small chrome" style="margin-bottom:4px;">Gate answer: <strong>Yes</strong> — <a id="revertGate" style="cursor:pointer;text-decoration:underline;">meant to click No? change it</a></div>${itemsHtml}` : `
      <div class="btnrow">
        <button id="gateYes">Yes</button>
        <button id="gateNo">No</button>
      </div>`}
    </div>
    <div class="btnrow">
      ${STATE.sectionIndex>0 ? '<button class="ghost" id="backBtn">Back a section</button>' : ''}
      <button class="ghost" id="saveProgressBtn">Save progress</button>
      <span id="saveProgressMsg" class="small chrome"></span>
    </div>
  `;

  if(gateAnswered !== true){
    document.getElementById('gateYes').onclick = ()=>{
      STATE.sectionState.answers[section.id] = true;
      render();
      saveDraft();
    };
    document.getElementById('gateNo').onclick = ()=>{
      STATE.sectionState.answers[section.id] = false;
      STATE.sectionState.sectionsDone[section.id] = 'no';
      STATE.sectionIndex++;
      render();
      saveDraft();
    };
  } else {
    document.getElementById('revertGate').onclick = ()=>{
      if(!confirm('This clears any answers already given in this section. Continue?')) return;
      section.items.forEach(it=>{ STATE.sectionState.answers[it.code] = undefined; STATE.sectionState.texts[it.code] = undefined; });
      if(section.sectionText) STATE.sectionState.texts[section.sectionText.code] = undefined;
      STATE.sectionState.answers[section.id] = false;
      STATE.sectionState.sectionsDone[section.id] = 'no';
      STATE.sectionIndex++;
      render();
      saveDraft();
    };
    document.querySelectorAll('button[data-code]').forEach(el=>{
      el.onclick = ()=>{
        const code = el.getAttribute('data-code');
        if(el.hasAttribute('data-toggle')){
          const alreadyTrue = STATE.sectionState.answers[code] === true;
          const group = el.getAttribute('data-group');
          const peers = group ? section.items.filter(it=>it.group===group) : section.items;
          peers.forEach(it=>{ STATE.sectionState.answers[it.code] = false; });
          STATE.sectionState.answers[code] = !alreadyTrue;
        } else {
          const value = el.getAttribute('data-value') === 'true';
          STATE.sectionState.answers[code] = value;
          // clear stale answers on any branch children if this item just went false
          if(value === false){
            section.items.forEach(it=>{
              if(it.branchFrom === code) STATE.sectionState.answers[it.code] = undefined;
            });
          }
        }
        render();
        saveDraft();
      };
    });
    document.querySelectorAll('[data-textfor]').forEach(el=>{
      el.oninput = ()=>{ STATE.sectionState.texts[el.getAttribute('data-textfor')] = el.value; };
    });
    document.querySelectorAll('[data-sectiontextfor]').forEach(el=>{
      el.oninput = ()=>{ STATE.sectionState.texts[el.getAttribute('data-sectiontextfor')] = el.value; };
    });
    if(document.getElementById('backBtn')){
      document.getElementById('backBtn').onclick = ()=>{
        STATE.sectionIndex--;
        render();
      };
    }
    const continueBtn = document.getElementById('continueBtn');
    if(continueBtn && !continueBtn.disabled){
      continueBtn.onclick = ()=>{
        const anyYes = section.items.some(it => STATE.sectionState.answers[it.code] === true);
        STATE.sectionState.sectionsDone[section.id] = anyYes ? 'yes' : 'no';
        if(anyYes) STATE.sectionState.anyYesOverall = true;
        // conflict checks (Section A)
        let warn = '';
        if(section.id==='A'){
          if(STATE.sectionState.answers.supports_rule && STATE.sectionState.answers.opposes_rule){
            STATE.sectionState.flagged = true;
            warn = 'Flagged: both "Supports rule" and "Opposes rule" checked — needs discussion.';
          }
          if(STATE.sectionState.answers.withdraw_rule && STATE.sectionState.answers.requests_change){
            STATE.sectionState.flagged = true;
            warn = (warn?warn+' ':'') + 'Flagged: both "Withdraw rule" and "Requests change" checked — do not auto-resolve, needs discussion.';
          }
        }
        if(warn){
          document.getElementById('warnBox').innerHTML = `<div class="warn">${warn}</div>`;
          setTimeout(()=>{ STATE.sectionIndex++; saveDraft(); render(); }, 900);
        } else {
          STATE.sectionIndex++;
          saveDraft();
          render();
        }
      };
    }
  }
  if(document.getElementById('backBtn') && gateAnswered!==true){
    document.getElementById('backBtn').onclick = ()=>{ STATE.sectionIndex--; render(); };
  }
  document.getElementById('saveProgressBtn').onclick = async ()=>{
    document.getElementById('saveProgressMsg').textContent = 'Saving…';
    await saveDraft();
    document.getElementById('saveProgressMsg').textContent = 'Progress saved — safe to close this tab and come back later.';
  };
}

function renderSectionL(){
  const seg = currentSegmentObj();
  if(STATE.sectionState.anyYesOverall){
    return renderSummary();
  }
  app.innerHTML = `
    ${topbar(STATE.coder)}
    <div class="card">
      <div class="segment-label chrome">Segment text (comment identity hidden)</div>
      <div class="segment-text">${escapeHtml(seg.text)}</div>
    </div>
    <div class="card chrome">
      <span class="section-tag">Section L — Non-substantive check</span>
      <div class="gate-question">Every gate in Sections A–K came back No for this segment. Is that correct because this segment is purely administrative/boilerplate (salutation, attachment header, disclaimer, plain contact info, or a bare signature)?</div>
      <div class="btnrow">
        <button id="lYes">Yes — non-substantive, as expected</button>
        <button id="lNo">No — flag for discussion</button>
      </div>
    </div>
  `;
  document.getElementById('lYes').onclick = ()=>{ STATE.sectionState.nonSubstantive = 'confirmed'; renderSummary(); };
  document.getElementById('lNo').onclick = ()=>{ STATE.sectionState.nonSubstantive = 'flagged'; STATE.sectionState.flagged = true; renderSummary(); };
}

function renderSummary(){
  const conf = STATE.sectionState.confidence;
  const showConfExplain = conf !== null && conf !== undefined && conf <= 3;
  const flagged = !!STATE.sectionState.flagged;
  const confOptions = [1,2,3,4,5].map(n=>{
    const cls = conf===n ? 'primary' : '';
    return `<button type="button" class="${cls}" data-conf="${n}" style="padding:6px 14px;">${n}</button>`;
  }).join('');

  app.innerHTML = `
    ${topbar(STATE.coder)}
    <div class="card chrome">
      <p class="small">All sections reviewed for this segment. Add anything below, then save.</p>

      <div class="field">
        <label>How confident are you in how you coded this segment? (1 = low, 5 = high)</label>
        <div class="btnrow" style="margin-top:2px;">${confOptions}</div>
      </div>
      ${showConfExplain ? `
      <div class="field">
        <label>You rated your confidence ${conf}/5 — briefly explain your rationale for this confidence level</label>
        <textarea id="confExplainBox">${STATE.sectionState.confidenceExplain||''}</textarea>
      </div>` : ''}

      <div class="field">
        <label><input type="checkbox" id="flagCk" ${flagged?'checked':''}/> Flag this segment for discussion</label>
      </div>
      ${flagged ? `
      <div class="field">
        <label>Coder rationale — why are you flagging this?</label>
        <textarea id="rationaleBox">${STATE.sectionState.rationale||''}</textarea>
      </div>` : ''}

      <div class="field">
        <label>Analyst memo (optional)</label>
        <textarea id="memoBox">${STATE.sectionState.memo||''}</textarea>
      </div>

      <div class="btnrow">
        <button class="ghost" id="backBtn">Back to sections</button>
        <button class="primary" id="saveBtn" ${conf?'':'disabled'}>Save & next segment</button>
      </div>
      ${conf ? '' : '<p class="small chrome">Select a confidence rating above to save.</p>'}
    </div>
  `;
  document.querySelectorAll('[data-conf]').forEach(el=>{
    el.onclick = ()=>{
      STATE.sectionState.confidence = parseInt(el.getAttribute('data-conf'), 10);
      saveDraft();
      renderSummary();
    };
  });
  document.getElementById('flagCk').onchange = (e)=>{
    STATE.sectionState.flagged = e.target.checked;
    renderSummary();
  };
  document.getElementById('backBtn').onclick = ()=>{ STATE.sectionIndex = CODEBOOK.length-1; STATE.sectionState.sectionsDone[CODEBOOK[CODEBOOK.length-1].id] = undefined; render(); };
  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn && !saveBtn.disabled){
    saveBtn.onclick = async ()=>{
      if(document.getElementById('rationaleBox')) STATE.sectionState.rationale = document.getElementById('rationaleBox').value;
      if(document.getElementById('confExplainBox')) STATE.sectionState.confidenceExplain = document.getElementById('confExplainBox').value;
      STATE.sectionState.memo = document.getElementById('memoBox').value;
      await saveCurrentSegment();
      await clearDraft();
      const list = assignedList();
      const next = list.find(id => !(STATE.responses[id] && STATE.responses[id].complete));
      if(!next){ STATE.view='done'; render(); }
      else { await beginSegment(next); }
    };
  }
}

async function saveCurrentSegment(){
  const seg = currentSegmentObj();
  const record = {
    complete:true,
    commentId: seg.commentId,
    answers: STATE.sectionState.answers,
    texts: STATE.sectionState.texts,
    nonSubstantive: STATE.sectionState.nonSubstantive || null,
    flagged: !!STATE.sectionState.flagged,
    memo: STATE.sectionState.memo || '',
    rationale: STATE.sectionState.rationale || '',
    confidence: STATE.sectionState.confidence || null,
    confidenceExplain: STATE.sectionState.confidenceExplain || '',
    codedAt: new Date().toISOString()
  };
  STATE.responses[seg.segmentId] = record;
  await safeSet('osha:responses:'+STATE.coder, JSON.stringify(STATE.responses));
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =========================================================
   ADMIN
   ========================================================= */
function renderAdmin(){
  const segCount = STATE.segments.length;
  const assignRows = CODERS.map(c=>{
    const n = (STATE.assignment[c] && STATE.assignment[c].order.length) || 0;
    return `<tr><td>${c}</td><td>${n}</td></tr>`;

    ${topbar('Admin / setup')}

      <div class="btnrow"><button id="testBackend">Test connection to sheet</button></div>
      <div id="testResult"></div>
    </div>
    <div class="card chrome">
      <p><strong>${segCount}</strong> segment(s) loaded.</p>
      <table class="admin-table">
        <tr><th>Coder</th><th># segments assigned</th></tr>
        ${assignRows}
      </table>
      <div class="btnrow">
        <button id="loadSample">Load sample data (${SAMPLE_SEGMENTS.length} segments)</button>
        <button id="genAssign">Generate / regenerate assignments</button>
      </div>
      <hr class="divider">
      <div class="field">
        <label>Paste segment data as JSON — array of {"commentId","segmentId","text"}</label>
        <textarea id="jsonBox" style="min-height:120px;"></textarea>
      </div>
      <div class="btnrow"><button id="saveJson">Save segments from JSON</button></div>
      <hr class="divider">
      <div class="btnrow"><button id="exportBtn">View / export all responses (CSV)</button></div>
      <div id="exportArea"></div>
    </div>
    <div class="card chrome">
      <p class="small">Live status — pulls current data from the sheet each time you click.</p>
      <div class="btnrow">
        <button id="progressBtn">View coding progress</button>
        <button id="flaggedBtn">View flagged segments for discussion</button>
        <button id="disagreeBtn">View coding disagreements</button>
      </div>
      <div id="progressArea"></div>
      <div id="flaggedArea"></div>
      <div id="disagreeArea"></div>
    </div>
    <footer class="foot"><a id="backLink">Back to coder select</a></footer>
  `;
  document.getElementById('backLink').onclick = ()=>{ STATE.view='select'; render(); };
  document.getElementById('testBackend').onclick = async ()=>{
    document.getElementById('testResult').innerHTML = `<p class="small chrome">Testing…</p>`;
    const result = await testBackend();
    document.getElementById('testResult').innerHTML = `<p class="small chrome" style="color:${result.ok?'var(--good)':'var(--flag)'};">${result.msg}</p>`;
  };
  document.getElementById('loadSample').onclick = async ()=>{
    if(STATE.segments.length>0 && !confirm('This will overwrite the current segment set. Continue?')) return;
    STATE.segments = SAMPLE_SEGMENTS;
    await safeSet('osha:segments', JSON.stringify(STATE.segments));
    render();
  };
  document.getElementById('genAssign').onclick = async ()=>{
    if(STATE.segments.length===0){ alert('Load segments first.'); return; }
    if(!confirm('Regenerate assignments now? This does not erase existing coder responses, but new assignment order may leave some in-progress work orphaned.')) return;
    STATE.assignment = generateAssignment();
    await safeSet('osha:assignment', JSON.stringify(STATE.assignment));
    render();
  };
  document.getElementById('saveJson').onclick = async ()=>{
    const txt = document.getElementById('jsonBox').value.trim();
    if(!txt) return;
    try{
      const parsed = JSON.parse(txt);
      if(!Array.isArray(parsed)) throw new Error('not an array');
      STATE.segments = parsed;
      await safeSet('osha:segments', JSON.stringify(STATE.segments));
      alert('Segments saved. Now click "Generate / regenerate assignments".');
      render();
    }catch(e){
      alert('Could not parse JSON: '+e.message);
    }
  };
  document.getElementById('exportBtn').onclick = async ()=>{
    const rows = await buildExportRows();
    const csv = rowsToCsv(rows);
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    document.getElementById('exportArea').innerHTML = `
      <p class="small chrome">${rows.length} coded segment record(s) found across all coders.</p>
      <a class="chrome" href="${url}" download="osha_pilot_coding_export.csv">Download CSV</a>
    `;
  };
  document.getElementById('progressBtn').onclick = async ()=>{
    document.getElementById('progressArea').innerHTML = `<p class="small chrome">Loading…</p>`;
    const progress = await computeProgress();
    const rows = CODERS.map(c=>{
      const p = progress[c] || {assigned:0, completed:0};
      const pct = p.assigned ? Math.round(100*p.completed/p.assigned) : 0;
      return `<tr><td>${c}</td><td>${p.assigned}</td><td>${p.completed}</td><td>${pct}%</td></tr>`;
    }).join('');
    document.getElementById('progressArea').innerHTML = `
      <table class="admin-table">
        <tr><th>Coder</th><th>Assigned</th><th>Completed</th><th>% done</th></tr>
        ${rows}
      </table>`;
  };
  document.getElementById('flaggedBtn').onclick = async ()=>{
    document.getElementById('flaggedArea').innerHTML = `<p class="small chrome">Loading…</p>`;
    const flagged = await computeFlagged();
    if(flagged.length === 0){
      document.getElementById('flaggedArea').innerHTML = `<p class="small chrome">No segments flagged for discussion yet.</p>`;
      return;
    }
    document.getElementById('flaggedArea').innerHTML = flagged.map(f => `
      <div class="card" style="border-color:var(--flag);">
        <div class="small chrome">${f.commentId} · ${f.segmentId}</div>
        <div class="segment-text" style="font-size:1rem;">${escapeHtml(f.text)}</div>
        <hr class="divider">
        ${f.flags.map(fl => `
          <div class="small chrome" style="margin-bottom:8px;">
            <strong>${fl.coder}</strong>${fl.confidence ? ' · confidence ' + fl.confidence + '/5' : ''}<br>
            ${fl.rationale ? escapeHtml(fl.rationale) : (fl.confidenceExplain ? escapeHtml(fl.confidenceExplain) : '<em>No rationale text given.</em>')}
          </div>
        `).join('')}
        <div class="field">
          <label>Decision from discussion (visible to everyone once saved)</label>
          <textarea data-resolution-for="${f.segmentId}">${f.existingResolution||''}</textarea>
        </div>
        <div class="btnrow">
          <button class="primary" data-save-resolution="${f.segmentId}">Save decision</button>
          <span class="small chrome" data-resolution-msg="${f.segmentId}"></span>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('[data-save-resolution]').forEach(btn=>{
      btn.onclick = async ()=>{
        const segId = btn.getAttribute('data-save-resolution');
        const noteEl = document.querySelector(`[data-resolution-for="${segId}"]`);
        const msgEl = document.querySelector(`[data-resolution-msg="${segId}"]`);
        msgEl.textContent = 'Saving…';
        const raw = await safeGet('osha:resolutions');
        const resolutions = raw ? JSON.parse(raw) : {};
        resolutions[segId] = { note: noteEl.value, savedAt: new Date().toISOString() };
        const ok = await safeSet('osha:resolutions', JSON.stringify(resolutions));
        msgEl.textContent = ok ? 'Saved.' : 'Save failed — try again.';
      };
    });
  };
  document.getElementById('disagreeBtn').onclick = async ()=>{
    document.getElementById('disagreeArea').innerHTML = `<p class="small chrome">Loading…</p>`;
    const results = await computeDisagreements();
    if(results.length === 0){
      document.getElementById('disagreeArea').innerHTML = `<p class="small chrome">No overlapping-coder disagreements found yet — either too few segments have 2+ completed coders, or everyone's agreeing so far.</p>`;
      return;
    }
    const codeLabel = (code)=>{
      for(const s of CODEBOOK){ const it = s.items.find(i=>i.code===code); if(it) return `${s.id} — ${it.label}`; }
      return code;
    };
    document.getElementById('disagreeArea').innerHTML = `<p class="small chrome">${results.length} segment(s) with disagreement, sorted by most fields in dispute.</p>` +
      results.map(f => `
      <div class="card" style="border-color:var(--accent);">
        <div class="small chrome">${f.commentId} · ${f.segmentId} — coded by: ${f.coders.join(', ')}</div>
        <div class="segment-text" style="font-size:1rem;">${escapeHtml(f.text)}</div>
        <hr class="divider">
        <div class="small chrome"><strong>Disagreed on:</strong></div>
        <ul>${f.disagreedCodes.map(c=>`<li class="small chrome">${codeLabel(c)}</li>`).join('')}</ul>
        ${f.memos.length ? `<hr class="divider"><div class="small chrome"><strong>Analyst memos:</strong></div>` + f.memos.map(m=>`<div class="small chrome" style="margin-bottom:4px;"><strong>${m.coder}:</strong> ${escapeHtml(m.memo)}</div>`).join('') : ''}
      </div>
    `).join('');
  };
}

async function computeDisagreements(){
  const byCoder = {};
  for(const coder of CODERS){
    const raw = await safeGet('osha:responses:'+coder);
    byCoder[coder] = raw ? JSON.parse(raw) : {};
  }
  const bySegment = {};
  CODERS.forEach(coder=>{
    Object.keys(byCoder[coder]).forEach(segId=>{
      const r = byCoder[coder][segId];
      if(!r.complete) return;
      if(!bySegment[segId]) bySegment[segId] = [];
      bySegment[segId].push({ coder, r });
    });
  });
  const allCodes = [];
  CODEBOOK.forEach(s => s.items.forEach(it => allCodes.push(it.code)));

  const results = [];
  Object.keys(bySegment).forEach(segId=>{
    const entries = bySegment[segId];
    if(entries.length < 2) return;
    const disagreedCodes = allCodes.filter(code=>{
      const vals = entries.map(e => !!(e.r.answers && e.r.answers[code]));
      return !vals.every(v => v === vals[0]);
    });
    if(disagreedCodes.length === 0) return;
    const seg = STATE.segments.find(s=>s.segmentId===segId);
    results.push({
      segmentId: segId,
      commentId: seg ? seg.commentId : '(unknown — segment data not loaded)',
      text: seg ? seg.text : '(segment text unavailable)',
      coders: entries.map(e=>e.coder),
      disagreedCodes,
      memos: entries.filter(e=>e.r.memo).map(e=>({coder:e.coder, memo:e.r.memo}))
    });
  });
  results.sort((a,b)=> b.disagreedCodes.length - a.disagreedCodes.length);
  return results;
}

async function computeProgress(){
  const progress = {};
  for(const coder of CODERS){
    const assigned = (STATE.assignment[coder] && STATE.assignment[coder].order.length) || 0;
    const raw = await safeGet('osha:responses:'+coder);
    const responses = raw ? JSON.parse(raw) : {};
    const completed = Object.values(responses).filter(r => r.complete).length;
    progress[coder] = { assigned, completed };
  }
  return progress;
}

async function computeFlagged(){
  const resRaw = await safeGet('osha:resolutions');
  const resolutions = resRaw ? JSON.parse(resRaw) : {};
  const bySegment = {};
  for(const coder of CODERS){
    const raw = await safeGet('osha:responses:'+coder);
    const responses = raw ? JSON.parse(raw) : {};
    Object.keys(responses).forEach(segId=>{
      const r = responses[segId];
      if(!r.complete || !r.flagged) return;
      if(!bySegment[segId]) bySegment[segId] = [];
      bySegment[segId].push({ coder, rationale: r.rationale, confidence: r.confidence, confidenceExplain: r.confidenceExplain });
    });
  }
  return Object.keys(bySegment).map(segId=>{
    const seg = STATE.segments.find(s=>s.segmentId===segId);
    return {
      segmentId: segId,
      commentId: seg ? seg.commentId : '(unknown — segment data not loaded)',
      text: seg ? seg.text : '(segment text unavailable — reload segment data)',
      flags: bySegment[segId],
      existingResolution: resolutions[segId] ? resolutions[segId].note : ''
    };
  });
}

async function buildExportRows(){
  const allCols = [];
  CODEBOOK.forEach(s => s.items.forEach(it => allCols.push(it.code)));
  const textCols = [];
  CODEBOOK.forEach(s => {
    s.items.forEach(it => { if(it.hasText) textCols.push(it.code+'_specify'); });
    if(s.sectionText) textCols.push(s.sectionText.code);
  });
  const resRaw = await safeGet('osha:resolutions');
  const resolutions = resRaw ? JSON.parse(resRaw) : {};
  const header = ['coder','commentId','segmentId','flagged','group_resolution','non_substantive','memo','rationale','confidence','confidenceExplain','codedAt'].concat(allCols).concat(textCols);
  const rows = [header];
  for(const coder of CODERS){
    const raw = await safeGet('osha:responses:'+coder);
    if(!raw) continue;
    const responses = JSON.parse(raw);
    Object.keys(responses).forEach(segmentId=>{
      const r = responses[segmentId];
      if(!r.complete) return;
      const resolution = resolutions[segmentId] ? resolutions[segmentId].note : '';
      const row = [coder, r.commentId, segmentId, r.flagged?1:0, resolution, r.nonSubstantive||'', r.memo||'', r.rationale||'', r.confidence||'', r.confidenceExplain||'', r.codedAt||''];
      allCols.forEach(c => row.push(r.answers && r.answers[c] ? 1 : 0));
      textCols.forEach(c => { const code = c.replace('_specify',''); row.push((r.texts && r.texts[code]) || ''); });
      rows.push(row);
    });
  }
  return rows;
}

function rowsToCsv(rows){
  return rows.map(r => r.map(cell=>{
    const s = String(cell===undefined||cell===null ? '' : cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}

init();
